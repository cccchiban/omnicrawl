<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Voice Agent</title>

<!-- ── CSS（按层级加载） ─────────────────────────────── -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/title-bar.css">
<link rel="stylesheet" href="css/chat-area.css">
<link rel="stylesheet" href="css/messages.css">
<link rel="stylesheet" href="css/input-area.css">
<link rel="stylesheet" href="css/status-bar.css">
<link rel="stylesheet" href="css/dialog.css">

<!-- ── 外部依赖 ──────────────────────────────────────── -->
<script src="js/polyfills.js"></script>
<script src="vendor/marked.min.js"></script>

<!-- ── QWebChannel 通信桥（PyQt5 注入 qt.webChannelTransport） ── -->
<script src="qwebchannel.js"></script>
</head>
<body>
<div id="app">

  <!-- ── 侧边栏 ─────────────────────────────────── -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="sidebar-title">AI Voice Agent</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">对话</div>
        <a href="#" class="nav-item active" id="nav-new-chat">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 4v16m8-8H4"/></svg>
          新对话
        </a>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">项目</div>
        <a href="#" class="nav-item" id="nav-export">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          导出对话
        </a>
      </div>
    </nav>
  </aside>

  <!-- ── 主内容区 ───────────────────────────────── -->
  <main id="main">

    <!-- 顶部操作栏 -->
    <header id="title-bar">
      <div class="title-left">
        <div class="model-selector-wrapper" id="model-selector-wrapper">
          <button class="model-selector" id="model-selector" title="选择模型">
            <span id="model-label">选择模型</span>
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="model-dropdown hidden" id="model-dropdown">
            <div class="model-dropdown-header">选择 AI 模型</div>
            <div class="model-dropdown-list" id="model-dropdown-list"></div>
          </div>
        </div>
      </div>
      <div class="title-right">
        <button class="export-btn" id="export-btn" title="导出对话记录">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        </button>
      </div>
    </header>

    <!-- 消息滚动区 -->
    <div id="chat-area">
      <div id="messages"></div>
    </div>

    <!-- 状态栏 -->
    <footer id="status-bar">
      <div class="status-left">
        <button id="stop-btn" class="stop-btn hidden" title="停止生成" aria-label="停止 AI 回复">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
          停止
        </button>
        <div id="typing-indicator" class="typing-dots hidden">
          <span></span><span></span><span></span>
        </div>
        <span id="status-text"></span>
      </div>
      <div class="status-right">
        <span id="speaking-icon" class="voice-icon hidden">&#x1F50A;</span>
        <span id="listening-icon" class="voice-icon hidden">&#x1F3A4;</span>
        <span id="token-display" class="token-info"></span>
      </div>
    </footer>

    <!-- 输入区 -->
    <div id="input-area">
      <div class="input-container">
        <div class="input-wrapper">
          <textarea id="chat-input" rows="1"
            placeholder="输入消息…  Enter 发送 · Shift+Enter 换行"></textarea>
        </div>
        <button id="send-btn" class="persona-btn" disabled>
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </span>
        </button>
      </div>
    </div>

  </main>

  <!-- ── 通知条 ─────────────────────────────────── -->
  <div id="notice-bar" class="notice hidden">
    <span id="notice-text"></span>
  </div>

</div>

<!-- ── JS（按依赖顺序加载） ──────────────────────────── -->
<script src="bridge.js"></script>
<script src="js/state.js"></script>
<script src="js/markdown.js"></script>
<script src="js/messages.js"></script>
<script src="js/tools.js"></script>
<script src="js/status.js"></script>
<script src="js/input.js"></script>
<script src="js/dialog.js"></script>
<script src="js/py-callbacks.js"></script>
<script src="js/app.js"></script>
</body>
</html>
