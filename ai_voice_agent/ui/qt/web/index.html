ody">        <p id="project-confirm-text">确定执行此操作吗？</p>      </div>      <div class="confirm-modal-footer">        <button class="confirm-btn confirm-btn-secondary" id="project-confirm-cancel">取消</button>        <button class="confirm-btn confirm-btn-danger" id="project-confirm-confirm">确定</button>      </div>    </div>  </div>  <div class="session-search-modal hidden" id="session-search-modal" role="dialog" aria-modal="true" aria-labelledby="session-search-title">    <div class="session-search-backdrop" id="session-search-backdrop"></div>    <section class="session-search-panel">      <div class="session-search-title" id="session-search-title">搜索对话</div>      <label class="session-search-input-wrap" for="session-search-input">        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">          <circle cx="11" cy="11" r="8"/>          <path d="M21 21l-4.35-4.35"/>        </svg>        <input id="session-search-input" type="search" autocomplete="off" placeholder="搜索标题、项目或时间" />      </label>      <div class="session-search-meta">        <span id="session-search-section-label">近期对话</span>        <span id="session-search-count"></span>      </div>      <div class="session-search-results" id="session-search-results" role="listbox"></div>    </section>  </div>  <!-- ── 主内容区 ───────────────────────────────── -->  <main id="main" class="empty-state">    <!-- 顶部操作栏 -->    <header id="title-bar">      <div class="title-left">        <div class="model-selector-wrapper" id="model-selector-wrapper">          <button class="model-selector" id="model-selector" title="选择模型">            <span id="model-selector-icon" class="model-icon other icon-fallback" title="Model">              <span class="model-icon-fallback">M</span>            </span>            <span id="model-label">选择模型</span>            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 9l6 6 6-6"/></svg>          </button>          <div class="model-dropdown hidden" id="model-dropdown"> -preview-popout-btn" class="html-preview-action" type="button" title="新窗口打开" aria-label="新窗口打开">          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">            <path d="M14 3h7v7M21 3l-9 9"/>            <path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/>          </svg>        </button>        <button id="html-preview-toggle-btn" class="html-preview-action" type="button" title="折叠显示区" aria-label="折叠显示区" aria-expanded="true">          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M15 18l-6-6 6-6"/></svg>        </button>      </div>    </header>    <div id="html-preview-empty" class="html-preview-empty">      <div class="html-preview-empty-icon" aria-hidden="true">        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">          <path d="M4 5h16v14H4z"/>          <path d="M8 9l-3 3 3 3M16 9l3 3-3 3M14 8l-4 8"/>        </svg>      </div>      <p>Agent 生成网页、表格或数据看板时会显示在这里。</p>    </div>    <iframe id="html-preview-frame" class="html-preview-frame hidden" title="HTML 显示区内容" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>  </aside>  <!-- ── 通知条 ─────────────────────────────────── -->  <div id="notice-bar" class="notice hidden">    <span id="notice-text"></span>  </div>  <div id="delete-undo-bar" class="delete-undo-bar hidden" role="status" aria-live="polite">    <span id="delete-undo-text"></span>    <button type="button" id="delete-undo-action">撤回</button>  </div>  </div></div><!-- ── JS（按依赖顺序加载） ──────────────────────────── --><script src="bridge.js"></script><script src="js/state.js"></script><script src="js/markdown.js"></script><script src="js/messages.js"></script><script src="js/tools.js"></script><script src="js/status.js"></script><script src="js/input.js"></script><script src="js/html-preview.js"></script><script src="js/dialog.js"></script><script src="js/project-sidebar.js"></script><script src="js/search-dialog.js"></script><script src="js/py-callbacks.js"></script>
