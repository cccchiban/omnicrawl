<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Voice Agent</title>

<!-- ── CSS（按层级加载） ─────────────────────────────── -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/title-bar.css">
<link rel="stylesheet" href="css/chat-area.css">
<link rel="stylesheet" href="css/messages.css">
<link rel="stylesheet" href="css/input-area.css">
<link rel="stylesheet" href="css/status-bar.css">
<link rel="stylesheet" href="css/dialog.css">

<!-- ── 外部依赖 ──────────────────────────────────────── -->
<script src="js/polyfills.js"></script>
<script src="vendor/marked.min.js"></script>

<!-- ── QWebChannel 通信桥（PyQt5 注入 qt.webChannelTransport） ── -->
<script src="qwebchannel.js"></script>
</head>
<body>
<div id="app">

  <!-- ── 侧边栏 ─────────────────────────────────── -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="sidebar-title">AI Voice Agent</span>
    </div>
    <button class="sidebar-toggle" id="sidebar-toggle" title="折叠/展开侧边栏" aria-label="折叠侧边栏" aria-expanded="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title session-section-title">
          <span>对话</span>
          <button class="session-refresh-btn" id="session-refresh-btn" title="刷新会话列表" aria-label="刷新会话列表">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 12a9 9 0 0 1-15.36 6.36M3 12A9 9 0 0 1 18.36 5.64M18 3v5h-5M6 21v-5h5"/></svg>
          </button>
        </div>
        <a href="#" class="nav-item active" id="nav-new-chat">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 4v16m8-8H4"/></svg>
          <span class="nav-label">新对话</span>
        </a>
        <div class="session-list" id="session-list">
          <div class="session-empty">正在加载会话...</div>
        </div>
        <a href="#" class="nav-item" id="nav-rename">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
          <span class="nav-label">重命名</span>
        </a>
        <a href="#" class="nav-item" id="nav-compact">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
          <span class="nav-label">压缩会话</span>
        </a>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">项目</div>
        <a href="#" class="nav-item" id="nav-export">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          <span class="nav-label">导出对话</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- ── 主内容区 ───────────────────────────────── -->
  <main id="main">

    <!-- 顶部操作栏 -->
    <header id="title-bar">
      <div class="title-left">
        <div class="model-selector-wrapper" id="model-selector-wrapper">
          <button class="model-selector" id="model-selector" title="选择模型">
            <span id="model-selector-icon" class="model-icon other icon-fallback" title="Model">
              <span class="model-icon-fallback">M</span>
            </span>
            <span id="model-label">选择模型</span>
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="model-dropdown hidden" id="model-dropdown">
            <div class="model-dropdown-header">选择 AI 模型</div>
            <div class="model-dropdown-list" id="model-dropdown-list"></div>
          </div>
        </div>
      </div>
      <div class="title-right">
        <button class="export-btn" id="export-btn" title="导出对话记录">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        </button>
      </div>
    </header>

    <!-- 消息滚动区 -->
    <div id="chat-area">
      <div id="messages"></div>
    </div>

    <!-- 状态栏 -->
    <footer id="status-bar">
      <div class="status-left">
        <button id="stop-btn" class="stop-btn hidden" title="停止生成" aria-label="停止 AI 回复">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
          停止
        </button>
        <div id="typing-indicator" class="typing-dots hidden">
          <span></span><span></span><span></span>
        </div>
        <span id="status-text"></span>
      </div>
      <div class="status-right">
        <span id="speaking-icon" class="voice-icon hidden">&#x1F50A;</span>
        <span id="listening-icon" class="voice-icon hidden">&#x1F3A4;</span>
        <span id="token-display" class="token-info"></span>
      </div>
    </footer>

    <!-- 输入区 -->
    <div id="input-area">
      <!-- Workspace 信息条 -->
      <div class="workspace-info" id="workspace-info">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span class="workspace-path" id="workspace-path">未检测到工作区</span>
        <span class="workspace-status" id="workspace-status">未激活</span>
      </div>
      <div class="input-container">
        <div class="input-wrapper">
          <textarea id="chat-input" rows="1"
            placeholder="输入消息…  Enter 发送 · Shift+Enter 换行"></textarea>
        </div>
        <!-- 推理强度下拉菜单 -->
        <div class="reasoning-dropdown-wrapper" id="reasoning-dropdown-wrapper">
          <button class="reasoning-toggle" id="reasoning-toggle" title="推理强度" aria-label="推理强度" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </button>
          <div class="reasoning-dropdown hidden" id="reasoning-dropdown">
            <div class="reasoning-dropdown-header">推理强度</div>
            <button class="reasoning-option active" data-value="none">
              <span class="check-mark"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17l-5-5"/></svg></span>
              <span class="option-label">关闭</span>
              <span class="option-desc">常规响应</span>
            </button>
            <button class="reasoning-option" data-value="low">
              <span class="check-mark"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17l-5-5"/></svg></span>
              <span class="option-label">轻度</span>
              <span class="option-desc">快速响应</span>
            </button>
            <button class="reasoning-option" data-value="medium">
              <span class="check-mark"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17l-5-5"/></svg></span>
              <span class="option-label">标准</span>
              <span class="option-desc">平衡质量与速度</span>
            </button>
            <button class="reasoning-option" data-value="high">
              <span class="check-mark"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17l-5-5"/></svg></span>
              <span class="option-label">深度</span>
              <span class="option-desc">详细推理</span>
            </button>
          </div>
        </div>
        <button id="send-btn" class="persona-btn" disabled>
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </span>
        </button>
      </div>
    </div>

  </main>

  <!-- ── 通知条 ─────────────────────────────────── -->
  <div id="notice-bar" class="notice hidden">
    <span id="notice-text"></span>
  </div>

</div>

<!-- ── JS（按依赖顺序加载） ──────────────────────────── -->
<script src="bridge.js"></script>
<script src="js/state.js"></script>
<script src="js/markdown.js"></script>
<script src="js/messages.js"></script>
<script src="js/tools.js"></script>
<script src="js/status.js"></script>
<script src="js/input.js"></script>
<script src="js/dialog.js"></script>
<script src="js/py-callbacks.js"></script>
<script src="js/app.js"></script>
</body>
</html>
