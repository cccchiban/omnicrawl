[workspace]
members = [
    "crates/omnicrawl-cli",
    "crates/omnicrawl-core",
    "crates/omnicrawl-ipc",
    "crates/omnicrawl-llm",
    "crates/omnicrawl-protocol",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
