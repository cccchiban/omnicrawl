[workspace]
members = [
    "crates/omnicrawl-cli",
    "crates/omnicrawl-commands",
    "crates/omnicrawl-compaction",
    "crates/omnicrawl-config",
    "crates/omnicrawl-config-chat",
    "crates/omnicrawl-connectors",
    "crates/omnicrawl-controllers",
    "crates/omnicrawl-core",
    "crates/omnicrawl-extensions",
    "crates/omnicrawl-host",
    "crates/omnicrawl-ipc",
    "crates/omnicrawl-llm",
    "crates/omnicrawl-mcp",
    "crates/omnicrawl-protocol",
    "crates/omnicrawl-session",
    "crates/omnicrawl-tui",
    "crates/omnicrawl-tts",
    "crates/omnicrawl-workspace",
    "crates/omnicrawl-api",
    "crates/omnicrawl-entry",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
# MSRV 由 wreq 的 BoringSSL 绑定（btls-sys）决定：它声明 rust-version = 1.85。
# 这是一次全工作区抬升——只有 omnicrawl-host 的 fetcher 用到 wreq，但 Cargo 的
# rust-version 是工作区级声明，无法只对单个 crate 抬高。
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# 保序：会话转录行与请求体都要跟着 Python 的 dict 插入序走，字典序会让两个实现写出的文件字节不同。
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# 内核自带传输：阻塞式 HTTP/1.1 + rustls，不引入异步运行时；
# 只要 TLS 与连接超时，gzip 等我们不发 Accept-Encoding 就用不上。
ureq = { version = "3", default-features = false, features = ["rustls"] }
# 浏览器指纹模拟：fetcher 工具的 impersonate 参数要靠它做真实的 JA3/JA4 与 HTTP/2 指纹匹配。
# 这是本项目唯一一处异步 HTTP 依赖，且刻意只给 omnicrawl-host 用——其余链路（llm、mcp、
# connectors、tts）继续走上面的阻塞式 ureq，避免把整个工作区拖进异步运行时。
#
# 关于 prefix-symbols：wreq 文档建议 Linux/Android 开启，以免与生态里同样静态链接 BoringSSL
# 的 openssl-sys 撞符号。本项目**不开**，两个原因：
#   1. 依赖树里没有 openssl-sys（链路里全部 HTTP 走 rustls），没有撞符号的对象；
#   2. 它与 Windows 的构建出口不兼容——btls-sys 的构建脚本一旦检测到 CMAKE_TOOLCHAIN_FILE
#      就提前返回（Windows 必须靠它绕开 CMP0091/ASM_NASM 的 generate 失败，见
#      tools/btls-msvc-runtime.cmake），会连前缀符号的注入一起跳过，于是 Rust 侧引用
#      `build_script_main_*` 而 C 库里没有这些符号，链接直接失败（568 个 LNK2019）。
# 若将来真引入 openssl-sys，需要连同 btls-sys 的前缀与交叉编译设置一起重新设计。
wreq = { version = "6.0.0-rc.31" }
# 浏览器设备档案库（100+ profile）。wreq 自身只提供 Emulation 容器结构，真正的
# Chrome/Firefox/Safari/Edge 指纹组合都在这里，通过 wreq_util::Emulation 引用。
wreq-util = "3.0.0-rc.14"
# 只为驱动 wreq：在专用线程上跑一个 current_thread runtime，把阻塞式调用方桥接到异步传输。
# 不启用 macros/rt-multi-thread——产品链路不需要 #[tokio::main]，也不该出现多线程运行时。
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
# 会话时间戳：对齐 Python datetime 的 ISO-8601（UTC、微秒）。只要解析/格式化与取当前时间。
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# 读取大转录：只读内存映射，整份内容不再复制进内核堆（Windows 与 POSIX 都走 OS 映射）。
memmap2 = "0.9"
# 全屏终端工作台：ratatui 负责布局与双缓冲渲染，crossterm 负责原始模式与跨平台输入事件。
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
# 输入框软折行与 HUD 对齐按显示列宽算，CJK 与 emoji 不能按字符数算。
unicode-width = "0.2"
# 搜索工具：与随包 Go 扩展（native/ocsearch）同一套语义——ripgrep 用的正则引擎，
# 以及 ripgrep 的遍历与 .gitignore/.ignore 剪枝（ocsearch 注释里就对齐 ignore crate）。
regex = "1"
ignore = "0.4"
# 网页正文提取：HTML5 容错解析（html5ever 系），比正则去标签更能应对真实站点的畸形标签。
scraper = "0.20"
# AI 消息与思考区的 Markdown 渲染：对映 Python 侧 Rich 的 RichMarkdown。
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
# 目标机上没有调试器：把「debug 断言」与溢出检查关掉，并让 LLVM 放心内联/展开。
# `debug_assertions = false` 是 release 默认值，这里显式写出以免将来被 profile
# 覆盖（`overflow-checks` 在 release 下默认也关，同样显式固定）。
debug-assertions = false
overflow-checks = false
# 无回溯需求（`panic = "abort"`），省掉展开表。
strip = "symbols"
