[workspace]
members = [
    "crates/omnicrawl-cli",
    "crates/omnicrawl-core",
    "crates/omnicrawl-ipc",
    "crates/omnicrawl-llm",
    "crates/omnicrawl-protocol",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# 内核自带传输：阻塞式 HTTP/1.1 + rustls，不引入异步运行时；
# 只要 TLS 与连接超时，gzip 等我们不发 Accept-Encoding 就用不上。
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
