[workspace]
members = [
    "crates/omnicrawl-cli",
    "crates/omnicrawl-commands",
    "crates/omnicrawl-compaction",
    "crates/omnicrawl-config",
    "crates/omnicrawl-connectors",
    "crates/omnicrawl-controllers",
    "crates/omnicrawl-core",
    "crates/omnicrawl-decision",
    "crates/omnicrawl-extensions",
    "crates/omnicrawl-fetch",
    "crates/omnicrawl-host",
    "crates/omnicrawl-ipc",
    "crates/omnicrawl-jsdom",
    "crates/omnicrawl-llm",
    "crates/omnicrawl-onejev",
    "crates/omnicrawl-mcp",
    "crates/omnicrawl-protocol",
    "crates/omnicrawl-session",
    "crates/omnicrawl-tui",
    "crates/omnicrawl-tts",
    "crates/omnicrawl-tls",
    "crates/omnicrawl-update",
    "crates/omnicrawl-version",
    "crates/omnicrawl-workspace",
    "crates/omnicrawl-api",
    "crates/omnicrawl-entry",
]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2021"
# MSRV 由依赖树里最高的那个声明决定，工作区级声明无法只对单个 crate 抬高。
# 抬到 1.91 的直接原因：omnicrawl-jsdom 用 boa_engine 0.22（0.21 解析不了
# `class A { static false() {} }`，会让现代 SPA 的 bundle 整份失效）。
# 之前抬到 1.90 的原因：图形栈 ratatui-image → icy_sixel → quantette / ordered-float。
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# 保序：会话转录行与请求体都要跟着 Python 的 dict 插入序走，字典序会让两个实现写出的文件字节不同。
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# 内核自带传输：阻塞式 HTTP/1.1 + rustls，不引入异步运行时；
# 只要 TLS 与连接超时，gzip 等我们不发 Accept-Encoding 就用不上。
ureq = { version = "3", default-features = false, features = ["rustls"] }
# 会话时间戳：对齐 Python datetime 的 ISO-8601（UTC、微秒）。只要解析/格式化与取当前时间。
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# 读取大转录：只读内存映射，整份内容不再复制进内核堆（Windows 与 POSIX 都走 OS 映射）。
memmap2 = "0.9"
# 全屏终端工作台：ratatui 负责布局与双缓冲渲染，crossterm 负责原始模式与跨平台输入事件。
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
# 工具卡里的图片预览：把 read_image 这类工具返回的图片按终端单元渲染。
# 只开 half-blocks 通路——它不做终端的图形协议查询，因此在任何终端（含 Windows
# Terminal 走的 ConPTY）上都能出图；默认特性里的 chafa 需要运行期 libchafa，一律关掉。
# 这条依赖把工作区 MSRV 从 1.85 抬到 1.90（它经 icy_sixel → quantette / ordered-float
# 传递要求 1.90），见上面 `rust-version` 的说明。
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
# 图片解码：格式与 read_image 承认的签名一一对应（PNG/JPEG/GIF/WebP），全部纯 Rust。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# 输入框软折行与 HUD 对齐按显示列宽算，CJK 与 emoji 不能按字符数算。
unicode-width = "0.2"
# 搜索工具：与随包 Go 扩展（native/ocsearch）同一套语义——ripgrep 用的正则引擎，
# 以及 ripgrep 的遍历与 .gitignore/.ignore 剪枝（ocsearch 注释里就对齐 ignore crate）。
regex = "1"
ignore = "0.4"
# 网页正文提取：HTML5 容错解析（html5ever 系），比正则去标签更能应对真实站点的畸形标签。
scraper = "0.20"
# AI 消息与思考区的 Markdown 渲染：对映 Python 侧 Rich 的 RichMarkdown。
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
# 目标机上没有调试器：把「debug 断言」与溢出检查关掉，并让 LLVM 放心内联/展开。
# `debug_assertions = false` 是 release 默认值，这里显式写出以免将来被 profile
# 覆盖（`overflow-checks` 在 release 下默认也关，同样显式固定）。
debug-assertions = false
overflow-checks = false
# 无回溯需求（`panic = "abort"`），省掉展开表。
strip = "symbols"
