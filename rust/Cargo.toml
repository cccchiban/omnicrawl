[workspace]
members = [
    "crates/omnicrawl-cli",
    "crates/omnicrawl-compaction",
    "crates/omnicrawl-config",
    "crates/omnicrawl-connectors",
    "crates/omnicrawl-controllers",
    "crates/omnicrawl-core",
    "crates/omnicrawl-ipc",
    "crates/omnicrawl-llm",
    "crates/omnicrawl-protocol",
    "crates/omnicrawl-session",
    "crates/omnicrawl-tui",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# 保序：会话转录行与请求体都要跟着 Python 的 dict 插入序走，字典序会让两个实现写出的文件字节不同。
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# 内核自带传输：阻塞式 HTTP/1.1 + rustls，不引入异步运行时；
# 只要 TLS 与连接超时，gzip 等我们不发 Accept-Encoding 就用不上。
ureq = { version = "3", default-features = false, features = ["rustls"] }
# 会话时间戳：对齐 Python datetime 的 ISO-8601（UTC、微秒）。只要解析/格式化与取当前时间。
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# 读取大转录：只读内存映射，整份内容不再复制进内核堆（Windows 与 POSIX 都走 OS 映射）。
memmap2 = "0.9"
# 全屏终端工作台：ratatui 负责布局与双缓冲渲染，crossterm 负责原始模式与跨平台输入事件。
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
# 输入框软折行与 HUD 对齐按显示列宽算，CJK 与 emoji 不能按字符数算。
unicode-width = "0.2"
# 搜索工具：与随包 Go 扩展（native/ocsearch）同一套语义——ripgrep 用的正则引擎，
# 以及 ripgrep 的遍历与 .gitignore/.ignore 剪枝（ocsearch 注释里就对齐 ignore crate）。
regex = "1"
ignore = "0.4"
# 网页正文提取：HTML5 容错解析（html5ever 系），比正则去标签更能应对真实站点的畸形标签。
scraper = "0.20"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
