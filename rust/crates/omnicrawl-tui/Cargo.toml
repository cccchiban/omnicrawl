[package]
name = "omnicrawl-tui"
description = "OmniCrawl 全屏终端工作台：内核协议 v1 的 Rust 宿主前端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "omnicrawl-tui"
path = "src/main.rs"

[dependencies]
# 图片预览：工具的视觉附件带的是 Base64 原文，要先解码再交给 image。
base64 = "0.23"
omnicrawl-config = { path = "../omnicrawl-config" }
omnicrawl-controllers = { path = "../omnicrawl-controllers" }
# 斜杠命令的候选来源（菜单只消费 CommandOption，不持有宿主）。
# 命令能力面（`CommandAgent`）的签名用到了 Skill 与会话条目类型，因此这两份也要直接依赖。
omnicrawl-commands = { path = "../omnicrawl-commands" }
# 配置对话（`/settings --chat`）的本地路由器与原子写回都在这个 crate。
omnicrawl-config-chat = { path = "../omnicrawl-config-chat" }
omnicrawl-core = { path = "../omnicrawl-core" }
omnicrawl-extensions = { path = "../omnicrawl-extensions" }
omnicrawl-session = { path = "../omnicrawl-session" }
# 宿主执行层：内核客户端、工具批次与工具执行体（与本地 API 共用）。
omnicrawl-host = { path = "../omnicrawl-host" }
# 渠道页「模型 ID」的自动检测：按渠道的协议直接发 GET 拉取模型列表。
omnicrawl-llm = { path = "../omnicrawl-llm" }
omnicrawl-protocol = { path = "../omnicrawl-protocol" }
omnicrawl-ipc = { path = "../omnicrawl-ipc" }
omnicrawl-mcp = { path = "../omnicrawl-mcp" }
# TTS 设置页的模型下载 / 音色克隆（引擎与下载器都在 omnicrawl-tts）。
omnicrawl-tts = { path = "../omnicrawl-tts" }
# 主 Agent 隔离工作区：启动准备（worktree/local）与退出收尾（apply + 清理）。
omnicrawl-workspace = { path = "../omnicrawl-workspace" }
# 会话回放按事件时间戳计算工具卡耗时（事件里的 `created_at`）。
chrono = { workspace = true }
crossterm = { workspace = true }
regex = { workspace = true }
ratatui = { workspace = true }
# 工具卡里的图片预览（read_image / image_gen 等）：解码 + 转半块字形。
image = { workspace = true }
ratatui-image = { workspace = true }
pulldown-cmark = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
# 集成测试解码图片与核对时间戳要用的依赖（生产代码里这些已随执行层搬走）。
base64 = "0.23"
chrono = { workspace = true }
# 渲染回归测试按显示宽度还原屏幕文本（宽字符占两格）。
unicode-width = { workspace = true }
# `[dependencies]` 里的 crate 对集成测试 crate 不可见，因此重复声明一份：
# `host_flow.rs` 需要按 `load_feature_enabled` 读出预期值，再与 `App` 真实装出来的工具表对账。
omnicrawl-config = { path = "../omnicrawl-config" }
