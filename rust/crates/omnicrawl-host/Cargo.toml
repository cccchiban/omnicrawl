[package]
name = "omnicrawl-host"
description = "宿主执行层：内核协议 v1 客户端、工具批次与工具执行体（TUI 与本地 API 共用）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.23"
# 响应体解压：服务端可能无视「我们不声明 accept-encoding」仍然回 gzip。
# flate2 已在依赖图里（ureq 的传输链带进来的），提为直接依赖不引入新的供应链面。
flate2 = "1"
# 截图编码：GDI 抓到的是 BGRA 位图，用纯 Rust 的 PNG 编码器落盘。
png = "0.17"
omnicrawl-config = { path = "../omnicrawl-config" }
omnicrawl-controllers = { path = "../omnicrawl-controllers" }
omnicrawl-core = { path = "../omnicrawl-core" }
# Skill 子系统：Skill 发现、索引与匹配（插件已移除，本 crate 只提供 Skill）。
omnicrawl-extensions = { path = "../omnicrawl-extensions" }
omnicrawl-ipc = { path = "../omnicrawl-ipc" }
omnicrawl-llm = { path = "../omnicrawl-llm" }
omnicrawl-mcp = { path = "../omnicrawl-mcp" }
omnicrawl-protocol = { path = "../omnicrawl-protocol" }
omnicrawl-session = { path = "../omnicrawl-session" }
# fetcher / web_search 的浏览器指纹通路：自研 TLS + HTTP/2 + HTTP/1.1 栈（纯 Rust，
# 不引入 BoringSSL、CMake、NASM 与 libclang）。
omnicrawl-tls = { path = "../omnicrawl-tls" }
# 出站 User-Agent（`omnicrawl/<产品版本>`）：审查 / 顾问 / 决策模型与向量召回共用同一身份。
omnicrawl-version = { path = "../omnicrawl-version" }
# 本地 JS 沙箱（boa_engine）：正文由脚本拼装时在本机重建，不联网、不伪造指纹。
omnicrawl-jsdom = { path = "../omnicrawl-jsdom" }
# TTS 云服务通道（OpenAI audio/speech 与 Gemini TTS），纯 HTTP，无原生依赖。
omnicrawl-tts = { path = "../omnicrawl-tts" }
# 沙盒内的 `git`：真隔离下 `git.exe` 是 MSYS 程序、起不来（见 tools/git.rs 的说明），
# 因此隔离时改由进程内的 gix 完成同样的仓库操作。
gix = { workspace = true }
chrono = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
scraper = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }
brotli = { version = "9.0.0", default-features = false, features = ["std"] }
# 正文字符集还原：GBK/GB18030/Big5/Shift_JIS 站点不能用 UTF-8 解。纯 Rust，无 C 依赖。
encoding_rs = "0.8"

# Linux 沙盒：Landlock 探测要直接发系统调用（`libc::syscall` 与 `SYS_landlock_*`）。
# 只给 Linux 目标，其余平台不进依赖图。
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# 后台命令树要随宿主退出（含崩溃）被回收：Windows Job Object 的 kill-on-close。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    # CreateJobObjectW 的签名带 SECURITY_ATTRIBUTES，必须一并开启；
    # CreateFileW（连接 OneJev 命名管道）同样要求它。
    "Win32_Security",
    # CreateFileW 与 FILE_ATTRIBUTE_NORMAL / OPEN_EXISTING / FILE_SHARE_* 都在这里。
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # 沙盒：AppContainer profile 与 SID 派生（userenv）。
    "Win32_Security_Isolation",
    # 沙盒：给工作区与临时目录加容器 ACE（GetNamedSecurityInfoW / SetEntriesInAclW）。
    "Win32_Security_Authorization",
    # 沙盒：匿名管道承载子进程 stdout/stderr。
    "Win32_System_Pipes",
    # 沙盒：io::Error 包装 Win32 错误码。
    "Win32_System_IO",
] }

