# OmniCrawl 子代理设置模板（首次启动自动复制为 subagents.toml）
# 子代理设置已从 config.toml 完全迁移到本文件；程序只读取 subagents.toml，
# 不再回退读取 config.toml 的 [subagents] 段。
version = 1

# SubAgent 全局边界：默认关闭；开启后三种角色的能力开关默认放开（verify / standard / worktree）。
[subagents]
enabled = false
max_depth = 1
default_timeout_seconds = 3600
model_request_concurrency = 2
# 保留以兼容既有配置；子代理已改为回合内同步串行执行，本项不再生效。
allow_background = false
# 仅开放已脱敏父公开上下文的 read_only/verify Fork；默认关闭。
allow_fork = false
allow_shared_workspace_writes = false
allow_worktree = true
allow_standard_agent = true
enable_verify_agent = true
verify_command_timeout_seconds = 120
task_retention_minutes = 60
result_summary_chars = 6000

# 单独设置每个子代理使用的模型；key 必须与 Agent 定义名一致（如 explore/plan/verify）。
# model 支持：models.toml key/alias、profile/model_id 或裸 model_id；
# 缺省或写 inherit 表示沿用父模型（与任务级 model=inherit 语义一致）。
[subagents.models.explore]
# model = "default-chat"

[subagents.models.plan]
# model = "default-chat"

[subagents.models.verify]
# model = "default-chat"

[subagents.models.general-purpose]
# model = "default-chat"
