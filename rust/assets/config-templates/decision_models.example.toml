# OmniCrawl 结构化决策模型配置（首次启动自动复制为 decision_models.toml）
#
# 结构化决策模型是独立于对话模型的第二类服务：送一段 state 加若干有类型的提问
# （choice / score / noul），拿回校准过的答案。它不做文本生成，也不进 models.toml
# 的对话模型目录——两套服务地址与模型命名空间互不相干。
#
# 支持的服务：Jev（TypeSafe AI）、Cloudflare Workers AI 与自部署的 OneJev（本机 qev 服务）。四种请求方式见下方 mode 注释。
# 密钥只写明文 api_key；不要提交到版本库。
version = 1

# 默认使用的决策渠道 key；留空或指向不存在的渠道时取第一条启用的渠道。
default_key = "jev-main"

[channels.jev-main]
name = "Jev 主渠道"
# 请求方式：
#   jev             —— 官方 TypeSafe System One 接口，POST {base_url}/v1/systemone，
#                      state + questions 直接进请求体；Bearer 鉴权。
#   chat_completions —— OpenAI 兼容接口，POST {base_url}/chat/completions，
#                      base_url 与 [image_gen] 同口径（填到 /v1）；
#                      同一份 state + questions 作为 user 消息发出，从返回内容里解析 answers。
#   cloudflare_workers_ai —— Cloudflare Workers AI 上的决策模型（@cf/cloudflare/clef-flash、
#                      @cf/cloudflare/clef），请求与返回形状同 jev（model + state +
#                      questions 进、顶层 answers 出），走原生 Run 端点；**没有
#                      base_url 可填**：地址由官方固定前缀加 account_id 拼出
#                      （https://api.cloudflare.com/client/v4/accounts/<id>/ai/run），
#                      因此只需填下面的 account_id 与 api_key（Cloudflare API Token，
#                      需带 Workers AI 读取权限）。模型名形如 @cf/cloudflare/clef-flash。
#                      不要用 OpenAI 兼容的 /ai/v1/chat/completions：那条路径只服务文本
#                      生成模型，决策模型会被判「缺少 model/state/questions」。
#                      注意请求体里的 model 只认最后一段（clef / clef-flash）：写盘与
#                      请求时由代码自动剥掉 @cf/cloudflare/ 前缀，端点路径仍保留全名。
#   onejev          —— 本机自部署的 OneJev 服务，与 jev 同一路径与形状（/v1/systemone），
#                      回环地址走命名管道；base_url 指向本地服务（见下方 [local]）。
mode = "jev"
# 接口基础地址：jev / onejev 填站点根（不含 /v1/systemone）；
# chat_completions 按 OpenAI 兼容口径填到 /v1（不含 /chat/completions）。
# cloudflare_workers_ai 不使用本项（留空即可，写入时会被账户号折算出的官方端点覆盖）。
base_url = "https://api.typesafe.ai"
# Cloudflare 账户号：仅 cloudflare_workers_ai 使用，其余方式留空。从仪表盘的 Workers AI
# 页面或右下角「Account ID」处复制；它出现在请求路径里，不是密钥。
# account_id = ""
# 内联密钥：jev / chat_completions / cloudflare_workers_ai 必填；onejev 可留空（留空则完全不发 Authorization 头）。
api_key = ""
# 决策模型：jev-latest 跟随最新版本；生产环境建议钉死版本（如 jev-1.13.0）。
model = "jev-latest"
# 请求失败后的重试次数（不含首次请求）：连接失败、超时与上游 5xx 按 0.2s→0.4s→0.8s（封顶 2s）
# 退避重试这么多次；4xx 不重试（那是请求本身的问题），读不到可用答案也不重试（不猜、不编）。
# 一次决策在回合路径上同步等待，因此次数要有界（上限 10）；0 表示不重试。
retry_count = 3
enabled = true

# 决策模型的功能开关。开关关闭时相关功能走原路径（当前即对话模型审查与本地排序检索）。
[features]
# 工具调用审查使用决策模型：开启后 approval.mode = review 的审查请求改走决策模型
# （同一份待审查负载当 state，问一个 choice 问题直接读回结论），不生成文本也不用
# 解析模型输出，因此更快。审查不可用时按 fail-closed 拒绝，不退化成对话模型审查。
tool_call_review = false

# 记忆搜索使用决策模型排序：开启后 memory_search 先取更宽的候选池（最多 20 条），
# 再让决策模型按相关度排序，按各候选项的置信度降序返回，条数仍按调用方给的
# max_results。决策服务不可用（缺渠道/凭据、超时、响应不可解析）时回退本地排序，
# 检索工具不会因此失败。
memory_search_rerank = false

# 知识库检索使用决策模型排序：对 kb_search 同理，候选描述用标题、路径与摘要。
kb_search_rerank = false

# Skill 检索使用决策模型排序：开启后 skill_search 带关键词检索时先取更宽的候选池（最多 20 条），
# 再让决策模型按相关程度排序，按各候选项的置信度降序返回，条数仍按调用方给的 max_results。
# 不带关键词（按作用域列出全部）时没有「相关度」可判，不送审。决策服务不可用时回退本地排序，
# 检索工具不会因此失败。
skill_search_rerank = false

# 联网搜索使用决策模型排序：开启后 web_search 对每一路渠道结果单独送审——本地先按关键词
# 覆盖度圈出该路前 10 条，交决策模型按相关度排序后每路保留前 5 条。engine=mixed 时每路各自
# 排序、各自最多 5 条，因此返回总量随渠道数增长（N 路 × 5 条），没有固定总量上限；只有调用方
# 显式给了 max_results 才收窄总数。决策服务不可用时回退本地顺序，搜索不会因此失败。
web_search_rerank = false

# 联网搜索的 BM25 排序是固定行为，不是开关：每一路渠道结果本地算 BM25（k1=1.2、b=0.75；
# 中文按二字片段切分），按得分排序后每路保留前 5 条。本地算分，不需要模型渠道，也没有网络往返。
# 该路候选没有一个命中查询词时才回退到上面的 web_search_rerank（若开启），再不可用则回退本地
# 关键词覆盖度排序，搜索不会因此失败。

# 提问由决策模型自动作答：开启后模型调用 ask_user 且带选项时，不再弹面板等你作答，
# 而是把提问正文、你本回合的请求与本回合已有的顾问答复交给决策模型，让它选最符合
# 你意图的一项。候选项末尾固定带一项「我有自己的想法...」：需要你自己填写答案时决策
# 模型会选它，提问就退回面板（由你选或输入自己的回答）。没有选项的提问（自由问答）
# 照旧交给你。决策服务不可用时回退到人工提问，不会替你瞎猜；自动作答会在会话流里
# 留一条提示。
ask_user_custody = false

# 旧一轮工具调用按需淘汰（先标注-后压缩）：只裁决「刚变老」的那一批（Agent 又推进了一批
# 之后，上一批才送审），最新一批永远保留，因此淘汰点贴近上下文尾部、前缀缓存不失效。送审按
# 「整组」判定——一次调用的请求 + 结果 + 拒绝一起走，协议不会留下半截。送审内容里带上
# **用户本回合的请求原文**（state.task），判定「还有没有用」以它为准。
#
# 判为无用的调用**不会当场离开上下文**：内核先把它当成一次「标注」落一条会话事件
# （tool_call_evicted），本回合的上下文原样保留原文；到**回合收尾**才把本轮所有标注一次性
# 移出，且先于工具调用概括与上下文压缩——被淘汰的原文因此不会被概括或压缩摘要再带回来。
#
# 送审范围不含记忆与知识库工具（memory_search / memory_read / memory_expand_related /
# memory_write、kb_search / kb_read / kb_write / kb_append / kb_list）、编辑与替换
# （write_file / Edit_file）与 git：记忆与知识库给的是跨回合的持久知识，重跑一次未必拿回同一份
# 内容；写文件与替换文本是已落盘的副作用，记录一旦被删，模型就不知道文件已经变成什么样、也无从
# 判断后续还要不要接着改；git 的结果是仓库当时的快照，重跑可能落在另一个状态上。
# read 与 grep **参与送审**：文件内容与检索结果重读重查即可拿回，适合交给决策模型判断。
# 决策服务不可用（缺渠道/凭据、超时、响应不可解析）时一律保留原文；淘汰结果落成会话事件，
# 重启后按同一份投影重建同一份上下文。
tool_call_prune = false

# 提问建议（`[suggestion] skills`）已迁出本文件：它现在由主模型识别技能词 + 本地 BM25 检索
# 本机 Skill 索引完成，不再经过决策模型，开关与说明见 `config.toml` 的 `[suggestion]` 段。
# 旧的 `tool_suggestion` / `subagent_suggestion` / `skill_suggestion` 三个键已删除，只有
# `skill_suggestion` 的取值会被读一次，用来把老的「已开启」状态迁到新段。

# 决策 REST 接口：把决策能力暴露给本机其它程序（CLI 工具、Skill、外部脚本），
# 它们不必经主模型就能拿到决策结果。大脑（主模型）负责规划，小脑（决策模型）负责
# 快速判定，两者通过这个接口协同。
#
# 端点（成功回 {"data": ...}，失败回 {"error": {code, message}}）：
#   GET  /health      健康检查
#   GET  /v1/status   服务与渠道自检（不回传凭据）
#   POST /v1/decide   通用：{state, questions} → {answers, raw}
#   POST /v1/choice   选优：{state, options, instructions?} → {index, answers}
#   POST /v1/rank     排序：{state, candidates, instructions?} → {order, count}
#   POST /v1/review   审查：{payload, fail_closed?} → {approved, reason, detail, confidence}
#
# 接口不做鉴权：只要监听地址可达就能直接调用。因此 host 只允许回环地址
# （127.0.0.1 / localhost / ::1），即只有本机程序能调用。
# 随 OmniCrawl 启动时自动拉起，本机已有服务则直接复用。
# 默认关闭。
[api]
enabled = false
host = "127.0.0.1"
# 端口：与本地 API（8765）错开。
port = 8767

# 自部署（OneJev）：在本机跑一份决策模型，不依赖云端服务。
#
# 官方发布 0.8B / 4B / 9B / 27B / 27B-FP8 五档（Hugging Face 的 OmniJev/OneJev-*），
# 由本机的判定 worker 直接驱动引擎，经命名管道（Windows）/ Unix socket 提供同一套判定——
# 不经 TCP 与 HTTP。设置面板的「结构化决策模型」页可以一键下载某一档、准备运行环境、
# 启停本地服务，并把决策渠道切到自部署。
# 权重与虚拟环境都在 model_dir 下（默认 ~/.omnicrawl/onejev），不进工作区。
[local]
# 当前部署的尺寸：0.8B / 4B / 9B / 27B-FP8 / 27B。
# 显存下限大致是 4 / 12 / 24 / 34 / 60 GB；没有独显时只能跑 CPU（很慢）。
size = "0.8B"
# 推理设备：auto（有 GPU 用 CUDA）/ cuda / cpu。
device = "auto"
# 数据根目录：权重在 <root>/models/、虚拟环境在 <root>/venv/、缓存与日志也在下面。
# 留空表示默认目录 ~/.omnicrawl/onejev。
model_dir = ""
# 决策渠道选了自部署（mode = "onejev"）时，是否随 OmniCrawl 启动自动准备本地服务：
# 本机已有服务在跑（本机所有实例共用一份）就直接复用，不会重复启动；服务常驻，
# 不随实例退出被回收，要停就在设置页点「停止服务」。
auto_start = true
# 启动后等待服务就绪的上限（秒）：首次加载权重并捕获 CUDA 图，大尺寸会久一些。
health_timeout_seconds = 600
