# OmniCrawl 首次启动配置
# API Key 会在首次启动时交互式写入当前用户配置目录。
version = 2

[llm.active_model]
source = "custom"
key = "default-chat"

[llm.defaults]
request_timeout_seconds = 180
request_retry_count = 5
discovery_timeout_seconds = 10
discovery_cache_ttl_seconds = 300
reasoning_effort = ""
thinking_type = "disabled"

[llm.profiles.openai-main]
provider = "openai"
enabled = true
base_url = "https://api.openai.com/v1"
# 凭据只写明文；留空时首启向导会在启动前补问。
api_key = ""
# 可选：覆盖该渠道请求使用的 HTTP User-Agent。
# 留空时统一报 `omnicrawl/<版本>`（版本来自 packages/cli/package.json）。
# user_agent = "OmniCrawl/1.0"
default_protocol = "openai_chat_completions"
default_context_window_tokens = 128000

[llm.profiles.openai-main.discovery]
enabled = true

[llm.profiles.anthropic-main]
provider = "anthropic"
enabled = false
base_url = "https://api.anthropic.com"
api_key = ""
default_protocol = "anthropic_messages"
default_context_window_tokens = 200000

[llm.profiles.anthropic-main.discovery]
enabled = true

[llm.profiles.gemini-main]
provider = "gemini"
enabled = false
base_url = "https://generativelanguage.googleapis.com"
api_key = ""
default_protocol = "gemini_generate_content"
default_context_window_tokens = 1000000

[llm.profiles.gemini-main.discovery]
enabled = true

# 联网搜索（web_search 工具）：默认引擎在 TUI /settings → 工具设置 → 联网搜索 中切换，
# 也可在此手改。duckduckgo / arxiv / huggingface
# 抓各自站点的公开搜索页，无需凭据，统一走浏览器指纹环境；
# github 配了 github_token 时走 REST 检索接口，未配时仍抓公开搜索页；
# tavily / exa / firecrawl / tinyfish 走各自的检索接口，需要配置对应的 API Key（写入本地 config.toml，不提交仓库）；
# anysearch 走统一检索接口，anysearch_api_key 可选——留空即按 IP 走匿名免费额度；
# tinyfish 走 GET 检索接口（每天 12,000 次以内免费），tinyfish_api_key 必填；
# 走哪个引擎只看这里的设置：工具调用里的 engine 参数无效，agent 不能按单次任务改搜索通路。
# mixed 是综合搜索：并发查询上述渠道并去重合并，接口型渠道只在配了凭据时参与（anysearch 始终参与）。
[web_search]
engine = "duckduckgo"
tavily_api_key = ""
exa_api_key = ""
firecrawl_api_key = ""
# AnySearch API Key（可选）：留空走匿名额度，填了则按该 Key 的付费额度计费。
anysearch_api_key = ""
# TinyFish API Key（必填才可用）：留空时调用该引擎会如实报缺凭据。
tinyfish_api_key = ""
# GitHub Token 可选：配置后 GitHub 引擎改走 REST 检索接口（30 次/分钟），
# 留空则抓公开搜索页（10 次/分钟）。token 只影响额度，无需勾选任何仓库权限。
github_token = ""

# 视觉模型代理：模型引用复用 llm.profiles / models.toml，不在这里存 API Key。
# models 按顺序作为故障转移链；主模型不支持视觉且此项开启时，图片会先交给这些模型分析。
# 模型原生视觉在设置页「视觉」按当前模型/渠道开关（models.toml 或 [llm.profiles.<id>] 的 native_vision）。
[vision]
enabled = false
models = []

# 图像生成：两条通道按 provider 二选一——OpenAI 兼容 Image API 与 Gemini 的
# generateContent。接口地址、Key、模型与默认参数在 TUI /settings → 图像生成 中配置；
# api_key 写入本地 config.toml（不提交仓库）。size/quality 是 OpenAI 通道的口径，
# aspect_ratio/image_size 是 Gemini 通道的口径，切换服务商不会丢掉另一家的取值。
[image_gen]
enabled = false
# 服务商：openai / gemini。
provider = "openai"
# OpenAI 通道：https://api.openai.com/v1；Gemini 通道：
# https://generativelanguage.googleapis.com/v1beta。
base_url = "https://api.openai.com/v1"
api_key = ""
# OpenAI 通道默认 gpt-image-2；Gemini 通道默认 gemini-2.5-flash-image。
model = "gpt-image-2"
# 仅 OpenAI 通道使用：auto 或 宽x高。
size = "auto"
# 仅 OpenAI 通道使用：auto / low / medium / high。
quality = "auto"
# 仅 OpenAI 通道使用：png / jpeg / webp（Gemini 恒为 png）。
output_format = "png"
# 仅 Gemini 通道使用：画面比例，14 种之一（留空由模型取默认）。
aspect_ratio = ""
# 仅 Gemini 通道使用：分辨率档位 1K / 2K / 4K（留空由模型取默认）。
image_size = ""
n = 1
timeout_seconds = 120

# TTS 语音合成（云服务）：两条通道按 tts_cloud.provider 二选一，本机不需要模型文件
# 或 espeak-ng 一类原生依赖，只要 HTTP 与密钥。在 TUI /settings → TTS 中配置。
[tts]
enabled = false
auto_play = true
# 回合结束后朗读助手回复（直接在宿主里合成播放，不经 tts_synthesize 工具、也不走审批）。
speak_replies = false
output_dir = ".omnicrawl/.agent_tmp/tts"

# 服务商路由：openai / gemini。
[tts_cloud]
provider = "openai"

# OpenAI 通道（provider = "openai" 时生效）：POST {base_url}/audio/speech。
# api_key 写入本地 config.toml（不提交仓库），也可在设置面板直接填写。
[tts_api]
base_url = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini-tts"
# 音色：alloy/ash/ballad/coral/echo/fable/nova/onyx/sage/shimmer/verse/marin/cedar。
voice = "alloy"
# 语气指令；只对 gpt-4o-mini-tts 一类模型生效，留空则不下发。
instructions = ""
# 语速（0.25~4.0）；1 时不下发该字段。
speed = 1
timeout_seconds = 120

# Gemini 通道（provider = "gemini" 时生效）：POST {base_url}/models/{model}:generateContent。
[tts_gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta"
api_key = ""
model = "gemini-2.5-flash-preview-tts"
# 预置音色名（如 Kore、Puck、Zephyr）。
voice = "Kore"
# 语气指令：Gemini 没有独立的指令字段，这段文本作为正文前缀下发。
instructions = ""
timeout_seconds = 120

[approval]
mode = "review"
# 自动审查使用的独立模型（可选）：留空时沿用 [llm] model。
# 审查请求与主对话完全隔离（不携带主对话上下文），独立模型不影响主对话成本，
# 且主模型被提示词注入时也不影响审查独立性；建议指定更便宜/更严格的模型。
# 审查范围是删除类、下载即执行类与高风险 Git 调用；memory_delete 不在其中。
review_model = ""

# 对话区思考块显示：关闭后思考内容仍照常产生并进入推理链路，只是不在
# 对话区渲染思考块（Markdown 渲染）。可在 TUI /settings 中切换。
[ui]
show_thinking = true

[memory]
enabled = true

# Skill 额外路径：目录或 .md 文件，相对路径按工作区解析。
# 与内置作用域一起参与发现，扫描顺序排在最后；同名 Skill 由先扫描到的作用域胜出。
# [skills]
# extra_paths = ["./my-skills", "~/.omnicrawl/shared-skills"]

# 内置工具开关：默认除 powershell 关闭外，其余全部启用。
# 只在需要禁用某个工具时取消注释并设为 false。
# [tools]
# powershell = false
# bash = true
# read_image = true

# 运行节奏护栏：Reasoning 死循环保护、白名单临时错误恢复与有限自动续跑。
# 自动续跑会增加模型请求次数和 Token 消耗；保存后从下一次回合生效。
[run_guard]
enabled = true

[run_guard.guard]
enabled = true
window_chars = 2000
substr_len = 32
repeat_ratio = 0.7
check_every = 50
max_blocks = 10000
max_chars = 500000
max_guard_retries = 2
# 白名单错误码：默认使用 provider-neutral 统一错误码（SERVICE_UNAVAILABLE 对应
# HTTP 5xx/网关临时不可用）。如需对网关等上游业务错误码/错误文本做自动重试，
# 可在此追加自定义字符串，例如 ["SERVICE_UNAVAILABLE", "PI_AI_ERROR"]。
auto_retry_errors = ["SERVICE_UNAVAILABLE"]

[run_guard.continue]
enabled = true
max_auto_followups = 3

# 桌面操作（Computer Use）：让模型通过截图观察窗口，并用鼠标键盘完成 GUI 任务。
# 由专职子代理执行，与 [subagents] 总开关互相独立；每次任务占用整个桌面，因此并发恒为 1。
# 本功能按时间收敛（不限制步数），无人工审核：破坏性动作由子代理先回报确认。
[computer_use]
enabled = false
# 专用子代理使用的模型；留空或 inherit 表示继承主模型。
model = ""
# 单次 computer_use 调用的时间预算（秒），超时会把已完成进度返回给模型。
timeout_seconds = 600
# 截图长边上限：同时决定坐标换算比例，越小越省 Token。
screenshot_max_dimension = 1024
# 专用子代理的思考强度：low / medium / high / xhigh / max。
# 桌面任务靠看画面、点控件收敛，深推理换不回转得动的操作，默认 low。
thinking_effort = "low"

[context_compaction]
# 上下文压缩是 Agent 的基础能力。触发阈值（Token）也可在运行设置面板按当前
# 模型上下文窗口的百分比设置（5% 步进）：trigger_context_tokens = 上下文窗口 × 百分比。
# 设置面板修改百分比后会保存该关系，并在上下文窗口变化时实时重算。
trigger_context_tokens = 100000
trigger_context_percent = 80
next_user_reserve_tokens = 10240
emergency_context_ratio = 0.85
summary_profile = ""
reasoning_effort = "low"
# 模型压缩「压缩即丢弃」：压缩后上下文只有摘要 + 最终回复锚点，不保留原文回合；
# recent_turns 仍用于触发预估的热窗口划分。
recent_turns = 6
target_summary_tokens = 0
preserve_exact_evidence = true
allow_cross_provider = false
failure_fallback = "deterministic"

# AI 消息可逆脱敏（opt-in，默认关闭）：把发往模型的消息副本中命中的敏感值
# 替换为 ｛Desensitized:n｝ 占位符，模型返回后按序号还原；原文不出本机。
# 仅作用于 AI 消息（含工具调用消息），不改动请求参数；设计文档见
# omnicrawl://docs/agent_gateway_desensitization_design.md。
# 说明：熵检测兜底（entropy_*）为 P2 增强，键位已保留。
# [desensitization]
# enabled = false                # 显式启用后才生效；未启用零成本
# fail_closed = true             # 屏蔽异常时中止请求，不静默发送原文
# strict_restore = false         # 还原缺失时中止并报错（默认保留 + 告警）
# extra_sensitive_keys = []      # 追加敏感键名
# exempt_keys = []               # 豁免键名（优先于命中）
# entropy_enabled = true         # 熵兜底开关（关闭则仅键名/结构匹配）
# entropy_min_length = 20        # 熵兜底长度下限
# entropy_min_bits = 3.5         # 熵兜底阈值
# entropy_pure_letters = false   # 纯字母令牌：长度达标即脱敏（默认关闭；十六进制字母串仍跳过）
# entropy_pure_digits = false    # 纯数字令牌：长度达标即脱敏（默认关闭）
# 值类型规则层（正则识别「无键名的敏感值类型」）：高危类型默认开启，
# 泛化类型（邮箱 / 外网 IP / 网址）误报较高，默认关闭、按需开启。
# detect_pem_private_key = true         # PEM 私钥（BEGIN/END … PRIVATE KEY）
# detect_db_connection_string = true    # 数据库连接串（URI / ADO 键值）
# detect_email = false                  # 邮箱地址
# detect_bank_card = true               # 银行卡号（Luhn 校验）
# detect_internal_ip = true             # 内网 IP（私有 / 链路本地）
# detect_external_ip = false            # 外网 IP（公网可路由）
# detect_url = false                    # 网址（http / https / ftp）
# detect_mac_address = true             # MAC 地址
# detect_license_plate = true           # 中国大陆车牌
# gitleaks 开源规则：默认加载内置离线快照（rust/crates/omnicrawl-llm/data/gitleaks.toml）；
# gitleaks_config_path 指向自定义文件时按规则 id 覆盖 / 追加（失败回退内置快照）。

[api]
bearer_token = "请替换为随机长令牌"
host = "127.0.0.1"
port = 8765
allowed_origins = ["http://localhost:5173"]
confirmation_timeout_seconds = 300
# uvicorn worker 进程数，默认 1（Run 状态、事件流、审批全部在进程内存里）。
# >1 时内核按连接在 worker 间轮询，同一客户端的后续请求可能落到任意 worker，
# 因此运行状态自动改走跨进程共享存储（~/.OmniCrawl/api-runs-<host>-<port>.sqlite3）。
# 每个 worker 会各自创建一个 Agent 与独立隔离 worktree，按机器核数与内存设置。
workers = 1

# 网页抓取接口：把 fetcher 工具的抓取能力以 REST 暴露给本机其它程序
# （Python 等批量脚本、CLI、Skill），它们不必经 Agent 回合就能抓网页。
#
# 端点（成功回 {"data": ...}，失败回 {"error": {code, message}}）：
#   GET  /health     健康检查
#   GET  /v1/status  服务自检（监听地址、URL 上限、固定指纹）
#   POST /v1/fetch   {urls | url, max_chars?, max_html?, timeout?, parallel?,
#                     insecure?, impersonate?, run_scripts?, force_scripts?}
#                    → {count, elapsed_seconds, results: [{url, error, status,
#                       final_url, title, content}]}
#
# 接口不做鉴权、不做参数校验：只要监听地址可达就能直接抓取。因此 host 只允许
# 回环地址（127.0.0.1 / localhost / ::1），即只有本机程序能调用。
# 抓取语义与 fetcher 工具同源：robots.txt 校验、浏览器指纹传输、正文提取与
# 脚本重建都不变，因此同样不绕过验证码。
# 随 OmniCrawl 启动时自动拉起，本机已有服务则直接复用。默认关闭。
[fetch_api]
enabled = false
host = "127.0.0.1"
# 端口：与本地 API（8765）、决策接口（8767）错开。
port = 8768
# 固定浏览器指纹族：chrome / firefox / safari / edge。留空表示按请求参数（默认 chrome）。
impersonate = ""
# 单次请求的 URL 上限：0 表示用默认上限 20，否则按 1–20 收窄。
max_urls = 0

[agent_temp]
enabled = true
directory = ".omnicrawl/.agent_tmp"
cleanup_enabled = true
cleanup_interval_hours = 24

# 启动自动更新：每次启动时联网比对 PyPI 最新版（检测结果带 24 小时本地缓存，
# 同一天不重复请求），本地版本落后时自动执行 pip 升级，完成后重新启动 TUI。
# 仅对 pip 正常安装的环境生效（源码目录或 editable 安装直接跳过）；离线、升级
# 失败或配置异常时按"继续使用当前版本"启动，不影响工具可用性。
# 设置 OMNICRAWL_SKIP_AUTO_UPDATE=1 可彻底关闭。
[update]
enabled = true

[plugins]
enabled = false

# SubAgent 设置已完全迁移到独立文件 subagents.toml（模板见 subagents.example.toml），
# 支持为每个子代理单独指定模型。本段不再从 config.toml 读取，
# 请直接编辑 subagents.toml 调整子代理全局边界与逐角色模型。
# [subagents]
# enabled = false
# max_depth = 1
# 保留以兼容既有配置；子代理已改为回合内同步串行执行，本项不再生效。
# default_timeout_seconds = 3600
# model_request_concurrency = 2
# allow_background = false
# allow_fork = false
# allow_worktree = true
# allow_standard_agent = true
# allow_shared_workspace_writes = false
# enable_verify_agent = true
# verify_command_timeout_seconds = 120
# task_retention_minutes = 60
# result_summary_chars = 6000
#
# [subagents.models.explore]
# model = "default-chat"

[mcp]
enabled = false
default_timeout_seconds = 30
# 工具输出预算为固定硬编码（单工具 50K 字符、每回合聚合 200K 字符）：
# 超限输出自动落盘到会话 artifact，模型上下文只保留头尾预览与文件路径。
servers = {}
# 远程 Streamable HTTP Server 可在这里声明认证请求头：
# [mcp.servers.remote_service]
# enabled = true
# transport = "streamable_http"
# url = "https://example.com/mcp"
#
# [mcp.servers.remote_service.headers]
# Authorization = "Bearer replace-with-token"
# X-API-Key = "replace-with-api-key"

[mcp.policy]
require_confirmation_for_write = true
require_confirmation_for_command = true
allow_external_network_tools = false
audit_log_enabled = true

# --- MQTT 自动化回路（遥测进、动作出；详见 assets/docs/MQTT.md）---------------------------
# 与消息平台连接器不同：入口是传感器报文，出口是带 request_id 与 TTL 的下发指令。
# 规则层永远在线，只在命中时唤醒一次模型。规划器二选一：agent（内核回合 + 工具白名单，
# 默认）或 decision（单次结构化决策，决策模型优先、未配置时回落主模型）。
# 启动：omnicrawl-host connector mqtt
#
# [mqtt]
# enabled = true
# broker = "mqtt://192.168.1.10:1883"      # 也支持 mqtts://host:8883
# client_id = "omnicrawl-farm"
# username = "farm"
# password_env = "OMNICRAWL_MQTT_PASSWORD"
# keepalive_seconds = 120
# qos = 1
# topics = ["farm/+/env"]
# zone_field = "zone"
# zone_topic_level = 1
# window_seconds = 30
# cooldown_seconds = 1800
# poll_seconds = 1
# command_topic = "farm/{zone}/command"
# ack_topic = "farm/{zone}/ack"
# ack_timeout_seconds = 15
# ttl_seconds = 300
# recent_actions = 5
# audit_path = "~/.OmniCrawl/mqtt/audit.jsonl"
#
# 规划器：agent = 内核回合（可查资料、多步推理，工具受白名单约束）；
#         decision = 单次结构化决策（决策模型优先，未配置时回落主模型）。
# planner = "agent"
# turn_timeout_seconds = 120
# 无人值守白名单：不在表里的工具既不声明给模型，宿主也不执行。
# 默认只读 + 记忆/知识库/联网检索；追加 bash / write_file 前先想清楚报文来源是否可信。
# tools = ["read", "list", "find", "grep", "memory_search", "memory_read", "kb_search",
#          "web_search", "fetcher"]
#
# [[mqtt.actions]]
# id = "open_vent"
# label = "打开通风口"
# description = "温度偏高、湿度偏大时通风降温除湿"
#
# [[mqtt.actions]]
# id = "do_nothing"
# label = "维持现状"
# description = "指标已在合适范围，无需干预"
#
# [[mqtt.rules]]
# id = "high_temp"
# metric = "temp"
# op = "gt"
# value = 28.0
# sustain_seconds = 300
# clear_value = 26.0
# actions = ["open_vent", "do_nothing"]
# fallback = "open_vent"
