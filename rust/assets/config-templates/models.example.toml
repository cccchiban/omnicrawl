# OmniCrawl 默认模型目录
# 不要在此文件中写入 api_key、token 或其他凭据。
version = 1

[models.default-chat]
display_name = "OpenAI 主渠道"
profile = "openai-main"
model_id = "gpt-5.2"
protocol = "openai_chat_completions"
enabled = true
aliases = ["default", "chat"]
description = "默认 OpenAI Chat Completions 模型"
tags = ["default", "tools"]
context_window_tokens = 128000
max_output_tokens = 8192
temperature = 0.7
# 模型原生视觉：true/false 显式指定该模型（或所属渠道）能否自行读图；
# 省略时按模型能力判断（设置页「视觉」可按当前模型开关，写入此键）。
native_vision = false
sort_order = 0

[models.default-chat.capabilities]
streaming = true
tools = true
parallel_tool_calls = true
reasoning = false
vision = false
model_discovery = true
prompt_cache = true

[models.anthropic-main]
display_name = "Anthropic 主渠道"
profile = "anthropic-main"
model_id = "claude-sonnet-4-5"
protocol = "anthropic_messages"
enabled = false
description = "Anthropic Messages 渠道"
tags = ["tools"]
context_window_tokens = 200000
max_output_tokens = 8192
sort_order = 10

[models.anthropic-main.capabilities]
streaming = true
tools = true
parallel_tool_calls = false
reasoning = true
vision = true
model_discovery = true
prompt_cache = true

[models.gemini-main]
display_name = "Gemini 主渠道"
profile = "gemini-main"
model_id = "gemini-2.5-pro"
protocol = "gemini_generate_content"
enabled = false
description = "Gemini Generate Content 渠道"
tags = ["tools"]
context_window_tokens = 1000000
max_output_tokens = 8192
sort_order = 20

[models.gemini-main.capabilities]
streaming = true
tools = true
parallel_tool_calls = false
reasoning = true
vision = true
model_discovery = true
prompt_cache = false
