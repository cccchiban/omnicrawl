# OmniCrawl 多模型配置示例（复制为 config.yaml 后填写）
# 凭据优先使用 api_key_env 指向的环境变量，避免明文写入仓库。
version: 2

llm:
  active_model:
    source: custom
    key: default-chat

  defaults:
    request_timeout_seconds: 180
    request_retry_count: 5
    discovery_timeout_seconds: 10
    discovery_cache_ttl_seconds: 300
    reasoning_effort: ""
    thinking_type: disabled

  profiles:
    openai-main:
      provider: openai
      enabled: true
      base_url: "https://api.openai.com/v1"
      api_key_env: OPENAI_API_KEY
      # 可选：覆盖该渠道请求使用的 HTTP User-Agent。
      # user_agent: "OmniCrawl/1.0"
      # 也可以直接写 api_key，但不推荐提交到仓库；此处仅保留占位符
      # api_key: "YOUR_OPENAI_API_KEY"
      default_protocol: openai_chat_completions
      discovery:
        enabled: true
      default_context_window_tokens: 128000

    # anthropic-main:
    #   provider: anthropic
    #   enabled: true
    #   api_key_env: ANTHROPIC_API_KEY
    #   default_protocol: anthropic_messages
    #   discovery:
    #     enabled: true

    # gemini-main:
    #   provider: gemini
    #   enabled: true
    #   api_key_env: GEMINI_API_KEY
    #   default_protocol: gemini_generate_content
    #   discovery:
    #     enabled: true

# 视觉模型代理：复用上面的 profiles 和 models.yaml，不在此重复保存 API Key。
# models 按顺序故障转移；也可在 TUI /settings → 视觉 中添加和排序。
vision:
  enabled: false
  models: []

approval:
  mode: manual

# TUI /settings 可即时修改并写回这些功能总开关。
memory:
  enabled: true

# 内置工具开关：默认除 powershell 关闭外，其余全部启用。
# 只在需要禁用某个工具时取消注释并设为 false。
# tools:
#   powershell: false
#   bash: true
#   windows_screenshot: true

# 两类搜索索引均默认关闭；可在 TUI /settings 中独立启用。
# 快照按 PRJ 隔离保存到 ~/.OmniCrawl/search-index/，不会写入项目目录。
file_name_index:
  enabled: false

content_index:
  enabled: false

# 模型辅助压缩默认关闭。开启后在完整回合结束时测量预算，达到 70K 才调用
# 摘要模型；普通 /compact 始终保持本地确定性，/compact --model 为显式模型入口。
# 开启后还会注册 recall_session_evidence，只按当前有效摘要的事件 ID 恢复证据。
context_compaction:
  enabled: false
  trigger_context_tokens: 70000
  next_user_reserve_tokens: 4096
  minimum_turns_between_model_compactions: 4
  emergency_context_ratio: 0.85
  # 空值复用当前模型；也可填写 models.yaml key/alias、model_id 或 profile/model_id。
  summary_profile: ""
  reasoning_effort: low
  recent_turns: 6
  recent_context_ratio: 0.25
  target_summary_tokens: 6000
  preserve_exact_evidence: true
  allow_cross_provider: false
  failure_fallback: deterministic

api:
  bearer_token: "请替换为随机长令牌"
  host: "127.0.0.1"
  port: 8765
  allowed_origins:
    - "http://localhost:5173"
  confirmation_timeout_seconds: 300

agent_temp:
  enabled: true
  directory: ".agent_tmp"
  cleanup_enabled: true
  cleanup_interval_hours: 24

plugins:
  enabled: false

# SubAgent：默认关闭；普通角色仅只读，verify 还需单独显式启用且仅运行固定检查。
subagents:
  enabled: false
  max_depth: 1
  max_concurrency: 2
  max_tasks_per_batch: 4
  default_timeout_seconds: 3600
  model_request_concurrency: 2
  allow_background: false
  # 仅开放已脱敏父公开上下文的 read_only/verify Fork；默认关闭。
  allow_fork: false
  # Phase 3 写能力默认关闭；需要时显式打开，且仍受脏主树检查/单写锁/审批约束。
  allow_worktree: false
  allow_standard_agent: false
  allow_shared_workspace_writes: false
  enable_verify_agent: false
  verify_command_timeout_seconds: 120
  task_retention_minutes: 60
  result_summary_chars: 6000

mcp:
  enabled: false
  default_timeout_seconds: 30
  max_tool_output_chars: 6000
  servers: {}
  # 远程 Streamable HTTP Server 可在这里声明认证请求头：
  # servers:
  #   remote_service:
  #     enabled: true
  #     transport: streamable_http
  #     url: https://example.com/mcp
  #     headers:
  #       Authorization: "Bearer replace-with-token"
  #       X-API-Key: "replace-with-api-key"
  policy:
    require_confirmation_for_write: true
    require_confirmation_for_command: true
    allow_external_network_tools: false
    audit_log_enabled: true
