# OmniCrawl 多模型配置示例（复制为 config.yaml 后填写）
# 凭据优先使用 api_key_env 指向的环境变量，避免明文写入仓库。
version: 2

llm:
  active_model:
    source: custom
    key: default-chat

  defaults:
    request_timeout_seconds: 180
    request_retry_count: 5
    discovery_timeout_seconds: 10
    discovery_cache_ttl_seconds: 300
    reasoning_effort: ""
    thinking_type: disabled

  profiles:
    openai-main:
      provider: openai
      enabled: true
      base_url: "https://api.openai.com/v1"
      api_key_env: OPENAI_API_KEY
      # 也可以直接写 api_key，但不推荐提交到仓库；此处仅保留占位符
      # api_key: "YOUR_OPENAI_API_KEY"
      default_protocol: openai_chat_completions
      discovery:
        enabled: true
      default_context_window_tokens: 128000

    # anthropic-main:
    #   provider: anthropic
    #   enabled: true
    #   api_key_env: ANTHROPIC_API_KEY
    #   default_protocol: anthropic_messages
    #   discovery:
    #     enabled: true

    # gemini-main:
    #   provider: gemini
    #   enabled: true
    #   api_key_env: GEMINI_API_KEY
    #   default_protocol: gemini_generate_content
    #   discovery:
    #     enabled: true

approval:
  mode: manual

api:
  bearer_token: "请替换为随机长令牌"
  host: "127.0.0.1"
  port: 8765
  allowed_origins:
    - "http://localhost:5173"
  confirmation_timeout_seconds: 300

agent_temp:
  enabled: true
  directory: ".agent_tmp"
  cleanup_enabled: true
  cleanup_interval_hours: 24

plugins:
  enabled: false

mcp:
  enabled: false
