[metadata]
name = omnicrawl-agent
version = 0.1.19
description = Local OmniCrawl agent with TUI, tools, MCP and NPM Hook plugins
long_description = file: README.md
long_description_content_type = text/markdown
requires_python = >=3.9
license = MIT
project_urls =
    Repository = https://github.com/cccchiban/omnicrawl

[options]
packages = find:
include_package_data = True
python_requires = >=3.9
install_requires =
    requests>=2.28.0
    openai>=1.68.0
    markdown>=3.4.0
    fastapi>=0.115.0
    uvicorn>=0.30.0
    httpx>=0.27.0
    textual>=8.2.7,<9.0
    PyYAML>=6.0
    tomli>=2.0; python_version < "3.11"
    tomli-w>=1.0
    anthropic>=0.40.0
    google-genai>=1.0.0
    curl_cffi>=0.6.0
    beautifulsoup4>=4.10.0

[options.packages.find]
include =
    omnicrawl*

[options.package_data]
omnicrawl =
    agent/system_prompt.md
    docs/*.md
    agent/subagents/builtin/*.md
    agent/context_compaction/summary_prompt.md
    extensions/node_runner.mjs
    config/templates/config.example.toml
    config/templates/models.example.toml
    config/templates/subagents.example.toml
    connectors/*.md

[options.entry_points]
console_scripts =
    ocl = omnicrawl.__main__:main
    omnicrawl = omnicrawl.__main__:main

[options.extras_require]
windows =
    pywin32>=306
