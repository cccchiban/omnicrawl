[build-system]
# 兼容本机 Anaconda 旧 pip/setuptools（当前常见 58.x）；有新环境仍可正常用 PEP 517。
requires = ["setuptools>=58", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicrawl-agent"
version = "0.1.17"
description = "Local OmniCrawl agent with TUI, tools, MCP and NPM Hook plugins"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{ name = "OmniCrawl" }]
urls = { Repository = "https://github.com/cccchiban/omnicrawl" }
dependencies = [
    "requests>=2.28.0",
    "openai>=1.68.0",
    "markdown>=3.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "textual>=8.2.7,<9.0",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "curl_cffi>=0.6.0",
    "beautifulsoup4>=4.10.0",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]

[project.scripts]
# ocl 是面向用户的短命令；保留 omnicrawl 兼容已有脚本。
ocl = "omnicrawl.__main__:main"
omnicrawl = "omnicrawl.__main__:main"

[tool.setuptools.packages.find]
include = ["omnicrawl*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
omnicrawl = [
    "agent/system_prompt.md",
    "docs/*.md",
    "agent/subagents/builtin/*.md",
    "agent/context_compaction/summary_prompt.md",
    "extensions/node_runner.mjs",
    "config/templates/config.example.toml",
    "config/templates/models.example.toml",
    "config/templates/subagents.example.toml",
    "connectors/*.md",
]
