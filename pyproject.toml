# OmniCrawl Python 侧：**冻结的语义基准**（操作手册见 rust/docs/frozen-reference.md）。
#
# 本包不再是产品实现——产品链路已全部迁到 rust/crates/ 并由 npm 分发。这里的模块只服务
# rust/tools/gen_*.py 生成 parity fixture 与 tests/ 的对照测试，因此：
#   · 不要在这里新增产品功能，功能缺口一律补到 rust/crates/；
#   · 改动语义实现后必须重跑对应的 gen_*_fixture.py，否则两侧契约会静默分叉。
#
# dependencies 里保留了 textual / fastapi / onnxruntime 一类「产品依赖」：它们被 parity 工具链
# 间接需要（gen_*.py 会 import omnicrawl.api / omnicrawl.tts），不随 Textual UI 下线一并移除。

[build-system]
requires = ["setuptools>=58", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicrawl-agent"
version = "0.1.66"
description = "Local OmniCrawl agent with TUI, tools, MCP and NPM Hook plugins"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{ name = "OmniCrawl" }]
urls = { Repository = "https://github.com/cccchiban/omnicrawl" }
dependencies = [
    "requests>=2.28.0",
    "openai>=1.68.0",
    "markdown>=3.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    # 流式（SSE）模型请求需要 HTTP/2 才能复用连接，缺少 h2 时每次请求都会
    # 重做一次 TLS 握手（见 omnicrawl/net/http_client.py）。
    "h2>=4.0.0,<5",
    "textual>=8.2.7,<9.0",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "curl_cffi>=0.6.0",
    "beautifulsoup4>=4.10.0",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
# NER 兜底层（BiLSTM-CRF：人名 / 地名 / 机构名），pip install -e .[ner]。
# CUDA 版 torch 请按官方 index 安装；CPU 版直接 pip install torch 即可，
# 推理时 auto 优先 CUDA、不可用自动回退 CPU（见 llm/desensitization/ner.py）。
ner = ["torch>=2.0"]
# 配置对话（omnicrawl.config_chat）：本地向量检索 + 类型校验写回，pip install -e .[config-chat]
config-chat = ["torch>=2.0"]
# TTS（omnicrawl.tts）：MOSS-TTS-Nano ONNX 推理，pip install -e .[tts]
tts = ["onnxruntime>=1.19.2", "sentencepiece>=0.1.99"]
# CUDA 版：先卸载 onnxruntime；设置页会按当前 Python 安装兼容的 CUDA/cuDNN wheel。
tts-cuda = [
    "onnxruntime-gpu<1.21.0",
    "nvidia-cuda-nvrtc-cu12<12.7",
    "nvidia-cuda-runtime-cu12<12.7",
    "nvidia-cublas-cu12<12.7",
    "nvidia-cufft-cu12<12.7",
    "nvidia-curand-cu12<10.3",
    "nvidia-cudnn-cu12<9.7",
    "sentencepiece>=0.1.99",
]

[project.scripts]
# ocl 是面向用户的短命令；保留 omnicrawl 兼容已有脚本。
ocl = "omnicrawl.__main__:main"
omnicrawl = "omnicrawl.__main__:main"

[tool.setuptools.packages.find]
include = ["omnicrawl*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
omnicrawl = [
    "docs/*.md",
    "extensions/node_runner.mjs",
    "config/templates/config.example.toml",
    "config/templates/models.example.toml",
    "config/templates/subagents.example.toml",
    "llm/desensitization/gitleaks.toml",
    "llm/desensitization/models/*.pt",
    "templates/*.md",
    "templates/subagents/*.md",
    "connectors/*.md",
    "ui/fullscreen/status/*.txt",
    "config_chat/assets/*.json",
    "config_chat/assets/*.pt",
]
