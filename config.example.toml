# OmniCrawl 多模型配置示例（复制为 config.toml 后填写）
# 凭据优先使用 api_key_env 指向的环境变量，避免明文写入仓库。
version = 2

[llm.active_model]
source = "custom"
key = "default-chat"

[llm.defaults]
request_timeout_seconds = 180
request_retry_count = 5
discovery_timeout_seconds = 10
discovery_cache_ttl_seconds = 300
reasoning_effort = ""
thinking_type = "disabled"

[llm.profiles.openai-main]
provider = "openai"
enabled = true
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
# 可选：覆盖该渠道请求使用的 HTTP User-Agent。
# user_agent = "OmniCrawl/1.0"
# 也可以直接写 api_key，但不推荐提交到仓库；此处仅保留占位符
# api_key = "YOUR_OPENAI_API_KEY"
default_protocol = "openai_chat_completions"
default_context_window_tokens = 128000

[llm.profiles.openai-main.discovery]
enabled = true

# [llm.profiles.anthropic-main]
# provider = "anthropic"
# enabled = true
# api_key_env = "ANTHROPIC_API_KEY"
# default_protocol = "anthropic_messages"
#
# [llm.profiles.anthropic-main.discovery]
# enabled = true

# [llm.profiles.gemini-main]
# provider = "gemini"
# enabled = true
# api_key_env = "GEMINI_API_KEY"
# default_protocol = "gemini_generate_content"
#
# [llm.profiles.gemini-main.discovery]
# enabled = true

# 视觉模型代理：复用上面的 profiles 和 models.toml，不在此重复保存 API Key。
# models 按顺序故障转移；也可在 TUI /settings → 视觉 中添加和排序。
[vision]
enabled = false
models = []

# TTS 语音合成（MOSS-TTS-Nano ONNX 推理，无需 PyTorch）：
# 首次启用时在 TUI /settings → TTS 中下载模型（约 763MB）并选择音色。
[tts]
enabled = false
# 留空使用默认 ~/.omnicrawl/tts/models（可用环境变量 OMNICRAWL_TTS_MODEL_DIR 覆盖）。
model_dir = ""
# 内置音色：Junhao/Zhiming/Weiguo/Xiaoyu/Yuewen/Lingyu/Trump/Ava/...（18 个）。
voice = "Junhao"
# 合成完成后自动播放生成的音频。
auto_play = true
# onnxruntime CPU 推理线程数（1/2/4/8）。
thread_count = 4
# 推理设备：auto 优先 CUDA，不可用时回退 CPU；cuda 不可用时直接报错。
device = "auto"
# codec 流式解码（低首字节延迟，默认关闭）。
streaming = false
# 生成音频默认保存目录。
output_dir = ".omnicrawl/.agent_tmp/tts"

[approval]
mode = "review"
# 自动审查使用的独立模型（可选）：留空时沿用 [llm] active_model。
# 审查请求与主对话完全隔离（不携带主对话上下文），独立模型不影响主对话成本，
# 且主模型被提示词注入时也不影响审查独立性；建议指定更便宜/更严格的模型。
review_model = ""

# TUI /settings 可即时修改并写回这些功能总开关。
[memory]
enabled = true

# 内置工具开关：默认除 powershell 关闭外，其余全部启用。
# 只在需要禁用某个工具时取消注释并设为 false。
# [tools]
# powershell = false
# bash = true
# windows_screenshot = true

# 上下文压缩是 Agent 的基础能力：完整回合结束时测量预算，达到阈值即调用摘要模型；
# 普通 /compact 保持本地确定性，/compact --model 为显式模型入口。
# 还会注册 recall_session_evidence，只按当前有效摘要的事件 ID 恢复证据。
# 阈值也可在运行设置面板按当前模型上下文窗口的百分比设置（5% 步进）：
# trigger_context_tokens = 上下文窗口 × 百分比。
# 通过设置面板修改百分比后会保存该关系，并在上下文窗口变化时实时重算。
[context_compaction]
trigger_context_tokens = 100000
trigger_context_percent = 80
next_user_reserve_tokens = 4096
minimum_turns_between_model_compactions = 4
emergency_context_ratio = 0.85
# 空值复用当前模型；也可填写 models.toml key/alias、model_id 或 profile/model_id。
summary_profile = ""
reasoning_effort = "low"
recent_turns = 6
recent_context_ratio = 0.25
# target_summary_tokens 为 0 表示不设摘要预算上限：摘要以完整性优先，
# 不被 token 预算卡住或校验拒绝。
target_summary_tokens = 0
preserve_exact_evidence = true
# 开启后，被压缩窗口的原始事件归档到 .agent_sessions/archive/compacted/<session>/，
# 形成摘要之外的二级存储，后续可精确恢复任意被压缩事件。
archive_compacted_events = true
# 开启后，压缩完成自动检索长期记忆并把命中结果注入后续上下文，帮助恢复"之前做过什么"。
auto_memory_recall = true
allow_cross_provider = false
failure_fallback = "deterministic"

[api]
bearer_token = "请替换为随机长令牌"
host = "127.0.0.1"
port = 8765
allowed_origins = ["http://localhost:5173"]
confirmation_timeout_seconds = 300

[agent_temp]
enabled = true
directory = ".omnicrawl/.agent_tmp"
cleanup_enabled = true
cleanup_interval_hours = 24

# 启动自动更新：每次启动时联网比对 PyPI 最新版（检测结果带 24 小时本地缓存，
# 同一天不重复请求），本地版本落后时自动执行 pip 升级，完成后重新启动 TUI。
# 仅对 pip 正常安装的环境生效（源码目录或 editable 安装直接跳过）；离线、升级
# 失败或配置异常时按"继续使用当前版本"启动，不影响工具可用性。
# 设置 OMNICRAWL_SKIP_AUTO_UPDATE=1 可彻底关闭。
[update]
enabled = true

[plugins]
enabled = false

# SubAgent 设置已分离到独立文件 subagents.toml（模板见 subagents.example.toml），
# 支持为每个子代理单独指定模型。未创建 subagents.toml 时回退读取本段；
# 本段与 subagents.toml 同时存在时以 subagents.toml 为准。
# [subagents]
# enabled = false
# max_depth = 1
# max_concurrency = 2
# max_tasks_per_batch = 4
# default_timeout_seconds = 3600
# model_request_concurrency = 2
# allow_background = false
# # 仅开放已脱敏父公开上下文的 read_only/verify Fork；默认关闭。
# allow_fork = false
# allow_shared_workspace_writes = false
# allow_worktree = false
# allow_standard_agent = false
# enable_verify_agent = false
# verify_command_timeout_seconds = 120
# task_retention_minutes = 60
# result_summary_chars = 6000
#
# [subagents.models.explore]
# model = "default-chat"

[mcp]
enabled = false
default_timeout_seconds = 30
# 工具输出预算为固定硬编码（单工具 50K 字符、每回合聚合 200K 字符）：
# 超限输出自动落盘到会话 artifact，模型上下文只保留头尾预览与文件路径。
servers = {}
# 远程 Streamable HTTP Server 可在这里声明认证请求头：
# [mcp.servers.remote_service]
# enabled = true
# transport = "streamable_http"
# url = "https://example.com/mcp"
#
# [mcp.servers.remote_service.headers]
# Authorization = "Bearer replace-with-token"
# X-API-Key = "replace-with-api-key"

[mcp.policy]
require_confirmation_for_write = true
require_confirmation_for_command = true
allow_external_network_tools = false
audit_log_enabled = true

# Telegram 远程接入（可选）：让用户通过 Telegram Bot 远程操作 OmniCrawl。
# 运行方式：python -m omnicrawl.connectors.telegram
# 环境变量优先级更高：TELEGRAM_BOT_TOKEN / TELEGRAM_ALLOWED_USER_IDS /
# TELEGRAM_CONFIRM_TIMEOUT。
[telegram]
# 由 @BotFather 创建 Bot 后获取，替换为实际 Token，勿提交真实 Token 到仓库。
bot_token = "替换为你的 Telegram Bot Token"
# 允许远程操作的用户 ID 列表（安全白名单，必填；向 @userinfobot 可查自己的 ID）。
allowed_user_ids = [123456789]
# 敏感工具（bash/powershell）确认超时秒数，超时自动拒绝。
confirmation_timeout_seconds = 300

# 工作区运行同步（可选）：TUI /workspace 切换与 Telegram /workspace 切换
# 都会写回此字段，供另一端在任务开始前重读跟随，实现跨进程工作区同步。
# 通常无需手工维护：AI_WORKSPACE_ROOT 环境变量仍优先于启动目录检测。
# [workspace]
# root = "D:/path/to/your/workspace"

# 主 Agent 隔离工作区（可选，默认开启）：TUI / API / 飞书连接器各自在
# ~/.omnicrawl/agent-worktrees/<实例ID>/ 下的独立 worktree（或 local 目录）中
# 读写，避免多个进程同时写同一工作区互相踩踏。
# 运行中可经 TUI 设置 →「隔离工作区」修改；保存后从下一次启动生效。
# [agent_workspace]
# enabled = true
# mode = "worktree"          # worktree（Git 工作树，推荐）| local（目录复制）
# base_ref = "HEAD"          # 基线提交
# detached = true            # Detached HEAD，不创建临时分支
# sync_uncommitted = true    # 把主工作区未提交改动以补丁带入隔离区
# apply_on_exit = true       # 退出时把隔离区变更应用回主工作区
# cleanup_on_exit = "auto"   # auto（四层门禁过滤后自动清理）| keep | never
# copy_dirs = [".env"]       # 复制 .gitignore 掉的目录/文件（如 node_modules）
# env_scripts = ["npm install"]  # 创建后运行的环境脚本（bash，可选）
