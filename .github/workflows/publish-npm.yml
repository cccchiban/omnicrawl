name: 发布 npm 包

# 触发：推 npm-v* tag，或手动触发。
# 认证：OpenID Connect（Trusted Publishing），不需要任何 npm token 或 OTP。
# 前置（在 npmjs.com 上为每个包各配一次）：
#   包设置 → Trusted publishing → GitHub Actions
#   仓库：cccchiban/omnicrawl
#   Workflow 文件名：publish-npm.yml
#   environment：留空
#   动作：勾选允许直接 npm publish（新连接默认只允许 staged publish）
#
# 内核是纯 Rust、静态链接（musl），没有 CPython 运行时；Windows 侧宿主是 MSVC 产物，
# 由 `--target <三元组>` 指到与内核同一个 `target/<三元组>/release/`；
# Linux 侧宿主载荷仍按构建机的原生 gnu 目标构建（因此依赖 runner 的 glibc），
# 原因见 rust/docs/python-free-build.md「发布产物的目标选择」。
# 但平台二进制仍只能在对应 runner 上构建（或交叉编译），因此矩阵里每个平台
# 各自构建内核（+ 宿主）并上传暂存产物，发布任务把所有平台下载齐、跑安装冒烟后才逐一发布。
# 没有宿主载荷的平台（32 位 Windows、armv7 嵌入式）只发内核，启动器会退回协议直连。
on:
  push:
    tags:
      - "npm-v*"
  workflow_dispatch:

permissions:
  contents: read
  # 必需：让工作流能取 OIDC token 换短期发布凭据。
  id-token: write

jobs:
  platform:
    name: 平台包（${{ matrix.package }}）
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: cli-win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            host: true
          - package: cli-win32-ia32
            runner: windows-latest
            target: i686-pc-windows-msvc
            host: false
          - package: cli-linux-x64
            # 内核是 musl 静态；宿主载荷是原生 gnu 目标（依赖 glibc，见构建宿主载荷那一步的注释）。
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            host: true
            zigbuild: true
          - package: cli-linux-arm-musl
            runner: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            host: false
            zigbuild: true
          - package: cli-linux-arm64-musl
            # 同 x64：内核 musl 静态，宿主载荷原生 gnu 目标。
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            host: true
            zigbuild: true
    steps:
      - uses: actions/checkout@v4

      # ubuntu 镜像自带 .NET / Android SDK / GHC 等大件（合计 15 GB 上下）。本工作区的
      # `cargo test --workspace` 会为 20 个 crate 编译带调试信息的测试二进制，实测不先腾地方
      # 会在链接阶段把根分区写满——现象是 rust-lld 直接 SIGBUS（Bus error）并伴随 runner 的
      # "running out of disk space" 警告。这里只删与本构建无关的大件，不碰
      # $AGENT_TOOLSDIRECTORY（Node / Python 工具链在里面），也不动 setup-node 之后的缓存。
      - name: 释放磁盘空间（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # 三个 musl 内核目标（x86_64 / armv7 / aarch64）都走 zig 交叉，pip 装 ziglang 是它的前置；
      # 具体理由见下面「zig 交叉工具链」一步。
      - uses: actions/setup-python@v5
        if: matrix.zigbuild
        with:
          python-version: "3.11"

      # wreq（fetcher 的浏览器指纹）静态链接 BoringSSL，其构建需要：
      #   * cmake 生成/驱动构建，perl 生成部分汇编与配置头；
      #   * libclang 供 btls-sys 的 bindgen 生成 Rust 绑定；
      #   * pkg-config 与 git 是 BoringSSL 官方文档列出的前置。
      - name: BoringSSL 构建依赖（Linux）
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          cmake perl pkg-config libclang-dev git

      # Windows 侧：libclang 供 bindgen；CMAKE_TOOLCHAIN_FILE 绕开 CMake 的
      # CMP0091/ASM_NASM 校验失败（MSVC_RUNTIME_LIBRARY ... not known for this
      # ASM_NASM compiler），原因与适用边界写在 rust/tools/btls-msvc-runtime.cmake。
      # 注意：该 toolchain file 只在 MSVC 构建需要，Linux 千万不要设——
      # 它会让 btls-sys 跳过自己的交叉编译装配。
      - name: BoringSSL 构建依赖（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install --no-progress -y llvm
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
          echo "CMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/rust/tools/btls-msvc-runtime.cmake" >> "$GITHUB_ENV"

      # musl 内核的 C/C++ 交叉工具链：pip 装 ziglang，cargo-zigbuild 作为 cargo 子命令。
      # 不用 apt 的 `musl-tools`，因为它只满足一部分：
      #   * 它只提供 `musl-gcc`（C）。x86_64 musl 上 cc-rs 会在 PATH 里找到 `musl-gcc` 并接受，
      #     但 aarch64 musl 在 cc-rs 的表里是硬的 `aarch64-linux-musl` 前缀，要的是
      #     `aarch64-linux-musl-gcc`，这个名字 musl-tools 不给；
      #   * 它不改 linker：cargo 仍会用宿主 cc 驱动，交叉到 musl 会编不过。
      # zig 自带 clang 与链接器驱动，cargo-zigbuild 会把它接进 CC/CXX/`-C linker`；
      # 不要再另外设 `CC_<target>` 之类的变量，会和它冲突。
      # `--locked` 是因为 zig 发布版与 cargo-zigbuild 的 C 编译器探测口径会变，钉住锁文件更可预期。
      - name: zig 交叉工具链
        if: matrix.zigbuild
        run: |
          python3 -m pip install --user ziglang
          cargo install cargo-zigbuild --locked --force

      - name: 构建内核
        working-directory: rust
        shell: bash
        env:
          # 只为省盘：CI 不需要调试信息，关掉后 debug/ 的体量从数 GB 掉到 1 GB 级别；
          # 断言失败的行号来自 panic 位置的源码元数据，不依赖 DWARF。（release 侧不受影响。）
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          # --no-fail-fast：一个测试目标失败也要把其余目标的失败一次性报全。
          cargo test --workspace --no-fail-fast
          if [ "${{ matrix.zigbuild }}" = "true" ]; then
            cargo zigbuild --release -p omnicrawl-cli --target ${{ matrix.target }}
          else
            cargo build --release -p omnicrawl-cli --target ${{ matrix.target }}
          fi

      - name: 构建宿主载荷（Windows：指到内核那个三元组）
        if: matrix.host && runner.os == 'Windows'
        run: node packages/cli/scripts/build-host.mjs --target ${{ matrix.target }}

      # Linux 侧刻意不带 `--target`：宿主载荷按构建机的原生 gnu 目标构建，因此发布包依赖
      # runner 的 glibc（Ubuntu 22.04 → glibc 2.35）。
      # 曾经的拦路石 `omnicrawl-tts → ort-sys`（musl 无预编译二进制）已随 TTS 改接口后端而消失，
      # x86_64 musl 的宿主载荷本机已整包构建通过；arm64 runner 上还没实测，所以这一步先保持原生目标，
      # 详见 rust/docs/python-free-build.md「发布产物的目标选择」。
      - name: 构建宿主载荷（Linux：原生目标）
        if: matrix.host && runner.os == 'Linux'
        run: node packages/cli/scripts/build-host.mjs

      - name: 宿主冒烟（无终端提示）
        if: matrix.host
        run: node packages/cli/scripts/host-smoke.mjs

      - name: 暂存平台包
        run: node packages/cli/scripts/prepare.mjs

      - name: 上传暂存产物
        uses: actions/upload-artifact@v4
        with:
          # 产物名就是平台包名：发布任务按名解包，直接落到 dist/npm/<平台包>/。
          name: ${{ matrix.package }}
          path: dist/npm/${{ matrix.package }}
          if-no-files-found: error
          # 载荷已是二进制与已压缩轮子，再压缩只花时间。
          compression-level: 0

  publish:
    name: 发布
    needs: platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted Publishing 需要 npm CLI 11.5.1 以上；npm 12 要求 Node 22.22.2 起，这里钉 11。
      - name: 升级 npm
        run: npm install -g npm@11

      - name: 校验 tag 与包版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "npm-v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} 与包版本 npm-v${version} 不一致。"
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          # 产物名就是平台包名：按名解包后即 dist/npm/<平台包>/（不合并，避免平铺相互覆盖）。
          pattern: cli-*
          path: dist/npm

      - name: 暂存启动器
        run: node packages/cli/scripts/prepare.mjs --launcher-only

      - name: 安装冒烟（干净前缀真装真跑）
        run: node packages/cli/scripts/install-smoke.mjs

      # 平台包在前、启动器在后：启动器的 optionalDependencies 是精确版本，顺序反了会装不到。
      - name: 发布平台分包
        run: |
          for package in cli-win32-ia32 cli-win32-x64 cli-linux-x64 cli-linux-arm-musl cli-linux-arm64-musl; do
            npm publish "dist/npm/${package}" --access public
          done

      - name: 发布启动器
        run: npm publish dist/npm/cli --access public
