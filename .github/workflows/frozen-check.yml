name: 冻结基准检查

# 背景：`omnicrawl/`（Python）已降级为**冻结的语义基准**——它只服务 rust/tools/gen_*.py
# 生成 parity fixture 与 tests/ 的对照测试，产品链路（Rust 内核 + Rust 宿主 + npm 分发）
# 不应再依赖 Python 解释器。
#
# 这条边界容易以「顺手加一行」的形式被侵蚀（CI 里补 pip install、构建脚本里 python -c 拿版本号），
# 因此做成每次推送都跑的机械约束。规则实现见 rust/tools/check_frozen_reference.mjs。
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frozen-reference:
    name: 产品链路不依赖 Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: 校验冻结边界
        run: node rust/tools/check_frozen_reference.mjs
